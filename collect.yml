name: Collect job links

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC)
  workflow_dispatch: {}    # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run collector
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node collect.js

      - name: Commit updated links.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/links.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update job links [skip ci]"
          git push
